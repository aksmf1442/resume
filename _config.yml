         - <mark>Jira 티켓과 GitLab 작업 흐름을 자동화</mark>하여 개발 이력 관리 최적화
         - [Flyway 도입을 통해 수동 DB 배포를 자동화된 스키마 관리 체계로 전환](https://haneul-blog.vercel.app/add-flyway)
         - <mark>서비스 운영</mark>
          - <mark>성능 개선</mark>
            - [Master-Slave 간 replication delay 문제를 분석하고 구조 개선](https://haneul-blog.vercel.app/db-replication-error)
            - [느린 쿼리의 Fetch Time 병목 구간을 분석하고 성능 최적화 진행](https://haneul-blog.vercel.app/oh-my-god-base64)
          - <mark>모니터링 및 로깅 시스템 구축 및 개선</mark>
            - 서비스 운영 효율화를 위해 <mark>Grafana, Loki, Prometheus 기반 모니터링·로깅 시스템 구축</mark> 및 개선
            - DB/Redis exporter와 서비스 로그, <mark>Tempo 트레이싱 도입</mark>으로 상세 지표 확보
            - CPU·디스크 사용량, 에러 코드 등 <mark>주요 지표 기반 Google Chat 알림 시스템 구축</mark>

