         - AWS EKS 기반의 <mark>초기사용 개발 인프라를 구축</mark>하고, <mark>네트워크·보안·노드 구성 및 배포 파이프라인 연동을 담당</mark>하여 안정적인 컨테이너 운영 환경을 확보
         - <mark>온프레미스 소규모 서버 환경에서 Docker Swarm 도입</mark>, 운영 프로세스를 회사 표준으로 장착
